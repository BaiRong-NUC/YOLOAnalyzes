# Ultralytics YOLOv8 detection model with a Swin-T backbone
# 注意：这里不是把 yolov8_vif.yaml 里的 VisionTransformer 单层直接替换成 SwinTransformer。
# 当前代码中的 SwinTransformer 是“完整 backbone”，会一次返回多尺度特征，再通过 Index 取出 P3/P4/P5。

# Parameters
nc: 80
scale: n
scales:
    n: [0.33, 0.25, 1024]
    s: [0.33, 0.50, 1024]
    m: [0.67, 0.75, 768]
    l: [1.00, 1.00, 512]
    x: [1.00, 1.25, 512]

backbone:
    # [from, repeats, module, args]
    # 0: Swin 主干，输出 3 个尺度特征 [192, 384, 768]
    - [
          -1,
          1,
          SwinTransformer,
          [
              768,
              96,
              [2, 2, 6, 2],
              [3, 6, 12, 24],
              7,
              4.0,
              0.0,
              0.0,
              0.2,
              [1, 2, 3],
          ],
      ]
    # 1,2,3: 分别取出 P3/8, P4/16, P5/32
    - [0, 1, Index, [192, 0]]
    - [0, 1, Index, [384, 1]]
    - [0, 1, Index, [768, 2]]

head:
    # P5 -> P4
    - [3, 1, nn.Upsample, [None, 2, "nearest"]]
    - [[-1, 2], 1, Concat, [1]]
    - [-1, 3, C2f, [512]]

    # P4 -> P3
    - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
    - [[-1, 1], 1, Concat, [1]]
    - [-1, 3, C2f, [256]]

    # P3 -> P4
    - [-1, 1, Conv, [256, 3, 2]]
    - [[-1, 6], 1, Concat, [1]]
    - [-1, 3, C2f, [512]]

    # P4 -> P5
    - [-1, 1, Conv, [512, 3, 2]]
    - [[-1, 3], 1, Concat, [1]]
    - [-1, 3, C2f, [1024]]

    # Detect(P3, P4, P5)
    - [[9, 12, 15], 1, Detect, [nc]]
